[project]
name = "clipper-backend"
version = "0.1.0"
description = "Private local video clipping workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "celery==5.6.3",
  "redis==6.4.0",
  "yt-dlp[default]==2026.10.26",
  "opencv-python-headless==4.13.0.92",
  "onnxruntime==1.31.1",
  "cryptography>=46,<52",
  "tzdata>=2026.6",
]

[project.optional-dependencies]
transcription = ["faster-whisper==1.2.1", "av==16.1.0"]
gpu = ["nvidia-cublas-cu12==12.9.3.13; sys_platform == 'linux'", "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests"]
